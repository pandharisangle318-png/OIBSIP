{% extends "_auth_shell.html" %}
{% block title %}Log in - ChatSphere{% endblock %}
{% block card %}
<h2>Welcome back</h2>
<p class="muted">Log in to pick up where you left off.</p>
<form method="post" action="{{ url_for('auth.login') }}" class="form" novalidate>
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label class="field">
    <span>Username</span>
    <input type="text" name="username" value="{{ username }}" autocomplete="username" autofocus required maxlength="20">
  </label>
  <label class="field">
    <span>Password</span>
    <div class="pw">
      <input type="password" name="password" autocomplete="current-password" required maxlength="128" id="pw">
      <button type="button" class="pw-toggle" data-target="pw" aria-label="Show password">Show</button>
    </div>
  </label>
  <button class="btn primary block" type="submit">Log in</button>
</form>
<p class="switch">New here? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
<script src="{{ url_for('static', filename='js/auth.js') }}" defer></script>
{% endblock %}
